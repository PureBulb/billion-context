<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="biliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#8e2de2"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ff7eb3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded rectangle -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="#0f172a" stroke="url(#biliGrad)" stroke-width="1.5"/>
  <!-- Folded context layers / compression waves -->
  <path d="M 12 16 L 24 10 L 36 16 L 24 22 Z" fill="url(#biliGrad)" opacity="0.85"/>
  <path d="M 12 24 L 24 18 L 36 24 L 24 30 Z" fill="url(#biliGrad)" opacity="0.6"/>
  <path d="M 12 32 L 24 26 L 36 32 L 24 38 Z" fill="url(#biliGrad)" opacity="0.35"/>
  <!-- Central compression node / lightning -->
  <circle cx="24" cy="24" r="4.5" fill="url(#coreGrad)" filter="url(#glow)"/>
</svg>
